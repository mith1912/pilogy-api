    "/api/v1/numerology/interpretations/{type}/{value}": {
      "get": {
        "operationId": "getInterpretation",
        "summary": "Complete unmodified imported article",
        "description": "Path type corresponds to the stable camelCase index ID. Internal route parameter is named index. Missing entries are not replaced with base-value content. Query string length is limited to 256 characters.",
        "parameters": [
          {
            "name": "type",
            "in": "path",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/IndexType"
            }
          },
          {
            "name": "value",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^(?:[1-9]|11|22|33)$"
            }
          },
          {
            "name": "locale",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "vi"
              ],
              "default": "vi"
            },
            "description": "Only vi. Repeated parameters and unknown query keys are rejected on content endpoints."
          },
          {
            "name": "If-None-Match",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string"
                },
                "description": "no-store for Calculate, config, health and errors; public, max-age=0, must-revalidate for public content."
              },
