{
  "openapi": "3.1.0",
  "info": {
    "title": "Numerology V1 API",
    "version": "1.0.0",
    "description": "Stateless Flutter backend. No authentication, database or profile storage. Vietnamese draft content version v1.0.0-draft; calculation version v1. Framework/platform errors outside implemented handlers may not use JSON envelopes. Native method restrictions return framework 405; WAF-generated 429 bodies are platform-controlled. The shared application error formatter supports RATE_LIMIT_EXCEEDED/Retry-After, but no application rate limiter is deployed. Known local framework exception: raw TRACE returns generic non-JSON 500 before route handlers; tracked for upstream/edge remediation."
  },
