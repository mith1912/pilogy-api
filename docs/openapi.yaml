    "/api/v1/numerology/calculate": {
      "post": {
        "operationId": "calculateNumerology",
        "summary": "Calculate all nine indices with complete short summaries",
        "description": "Stateless. No shared caching. Missing referenceDate resolves to current UTC calendar date. Same normalized input and explicit date produce deterministic numerical results; content is separately versioned. Entire response fails if any required interpretation is absent. JSON body limited to 4,096 UTF-8 bytes by default (private deployment override: 2,048–16,384). Query fields are rejected. Body reads have a 5-second deadline; incomplete or excessively fragmented streams return 400 INVALID_JSON.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CalculateRequest"
              },
              "example": {
                "fullName": "Nguyễn Văn An",
                "birthDate": "1990-05-20",
                "referenceDate": "2026-11-08",
                "locale": "vi"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string"
                },
                "description": "no-store for Calculate, config, health and errors; public, max-age=0, must-revalidate for public content."
              },
              "X-Content-Type-Options": {
                "schema": {
                  "const": "nosniff"
                }
              },
              "Referrer-Policy": {
                "schema": {
                  "const": "no-referrer"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CalculateResponse"
                }
              }
            }
          },
          "400": {
            "description": "INVALID_JSON or VALIDATION_ERROR",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string"
                },
                "description": "no-store for Calculate, config, health and errors; public, max-age=0, must-revalidate for public content."
              },
              "X-Content-Type-Options": {
                "schema": {
                  "const": "nosniff"
                }
              },
              "Referrer-Policy": {
                "schema": {
                  "const": "no-referrer"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "PAYLOAD_TOO_LARGE",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string"
                },
                "description": "no-store for Calculate, config, health and errors; public, max-age=0, must-revalidate for public content."
              },
              "X-Content-Type-Options": {
                "schema": {
                  "const": "nosniff"
                }
              },
              "Referrer-Policy": {
                "schema": {
                  "const": "no-referrer"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "UNSUPPORTED_MEDIA_TYPE",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string"
                },
                "description": "no-store for Calculate, config, health and errors; public, max-age=0, must-revalidate for public content."
              },
              "X-Content-Type-Options": {
                "schema": {
                  "const": "nosniff"
                }
              },
              "Referrer-Policy": {
                "schema": {
                  "const": "no-referrer"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "CALCULATION_RULE_UNSPECIFIED: vowel or consonant total is zero",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string"
                },
                "description": "no-store for Calculate, config, health and errors; public, max-age=0, must-revalidate for public content."
              },
              "X-Content-Type-Options": {
                "schema": {
                  "const": "nosniff"
                }
              },
              "Referrer-Policy": {
                "schema": {
                  "const": "no-referrer"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "INTERPRETATION_CONTENT_MISSING or INTERNAL_ERROR",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string"
                },
                "description": "no-store for Calculate, config, health and errors; public, max-age=0, must-revalidate for public content."
              },
              "X-Content-Type-Options": {
                "schema": {
                  "const": "nosniff"
                }
              },
              "Referrer-Policy": {
